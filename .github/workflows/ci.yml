name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,agent]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Gates
        run: |
          python tools/check_forbidden_imports.py
          python tools/check_ip.py
          python tools/check_no_foam_content.py
          python tools/audit_licenses.py
      - name: Vulnerabilities
        run: pip-audit --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Front end
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: JavaScript licences
        run: python tools/audit_js_licenses.py
