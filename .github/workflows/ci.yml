name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        # The type check and the tests import the optional packages the code uses (PySide6, VTK, OCP),
        # as the install guides do; with only `dev` and `agent`, mypy cannot find PySide6 and reports
        # every `type: ignore` on a VTK call as unused.
        run: python -m pip install -e ".[dev,agent,ui,extract,cad]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Gates
        run: |
          python tools/check_forbidden_imports.py
          python tools/check_ip.py
          python tools/check_no_foam_content.py
          python tools/audit_licenses.py
      - name: Vulnerabilities
        run: pip-audit --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Front end
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: JavaScript licences
        run: python tools/audit_js_licenses.py

  implicit-mesher:
    # ADR-0035 decisions 13, 15 and 33: the Rust mesher, its licences and advisories, and the tests
    # that need the real program (they skip without it in the gates job).
    name: implicit mesher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95
      - name: Build
        working-directory: native/implicit-mesh
        run: |
          cargo build --release --locked
          cargo test --release --locked
          mkdir -p bin
          cp target/release/stokes-implicit-mesh bin/
      - name: Rust licences and advisories
        run: |
          python tools/audit_rust_licenses.py --require
          cargo install cargo-audit --locked
          cargo audit --file native/implicit-mesh/Cargo.lock
      - name: Implicit tests with the real mesher
        run: |
          python -m pip install -e ".[dev]"
          STOKES_IMPLICIT_MESHER="$PWD/native/implicit-mesh/bin/stokes-implicit-mesh" pytest -q tests/test_implicit_mesher_binary.py
