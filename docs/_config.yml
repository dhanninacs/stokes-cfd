title: Stokes
description: An OpenFOAM GUI for Windows and Linux. Import STEP or model the part in the app, preview the flow on the GPU, mesh, solve and view results in one desktop CFD workbench.
url: https://dhanninacs.github.io
baseurl: /stokes-cfd
lang: en
# Profiles listed as sameAs in the structured data, so search engines tie them to the site.
social:
  name: Stokes
  links:
    - https://github.com/dhanninacs/stokes-cfd
    - https://www.linkedin.com/company/stokes-cfd/
# GoatCounter site code, e.g. "dhanninacs" for https://dhanninacs.goatcounter.com, from
# https://www.goatcounter.com/signup. Empty turns analytics off entirely: no script, no requests, no
# footer note. GoatCounter sets no cookies and stores no personal data, so there is no consent banner.
goatcounter: "dhanninacs"
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
defaults:
  - scope: { path: "" }
    values:
      layout: default
      image: /images/social-preview.png
exclude:
  - adr
  - engineering
  - plans
  - audit
include:
  - llms.txt
